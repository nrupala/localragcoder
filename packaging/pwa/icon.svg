<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#533483"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="#e94560" stroke-width="8"/>
  <!-- Document base -->
  <rect x="156" y="120" width="200" height="260" rx="16" fill="#16213e" stroke="#e94560" stroke-width="4"/>
  <!-- Text lines on document -->
  <rect x="180" y="160" width="120" height="6" rx="3" fill="#533483" opacity="0.8"/>
  <rect x="180" y="180" width="150" height="6" rx="3" fill="#533483" opacity="0.6"/>
  <rect x="180" y="200" width="100" height="6" rx="3" fill="#533483" opacity="0.6"/>
  <rect x="180" y="220" width="140" height="6" rx="3" fill="#533483" opacity="0.6"/>
  <rect x="180" y="250" width="100" height="6" rx="3" fill="#533483" opacity="0.6"/>
  <rect x="180" y="270" width="150" height="6" rx="3" fill="#533483" opacity="0.6"/>
  <rect x="180" y="290" width="120" height="6" rx="3" fill="#533483" opacity="0.6"/>
  <rect x="180" y="320" width="140" height="6" rx="3" fill="#533483" opacity="0.6"/>
  <rect x="180" y="340" width="90" height="6" rx="3" fill="#533483" opacity="0.6"/>
  <!-- Brain/network nodes on the right side -->
  <circle cx="340" cy="180" r="20" fill="url(#accent)" opacity="0.9"/>
  <circle cx="370" cy="250" r="16" fill="url(#accent)" opacity="0.7"/>
  <circle cx="350" cy="320" r="18" fill="url(#accent)" opacity="0.8"/>
  <!-- Connection lines -->
  <line x1="336" y1="200" x2="366" y2="236" stroke="#e94560" stroke-width="3" opacity="0.6"/>
  <line x1="366" y1="264" x2="352" y2="304" stroke="#e94560" stroke-width="3" opacity="0.6"/>
  <line x1="340" y1="196" x2="350" y2="304" stroke="#e94560" stroke-width="3" opacity="0.4"/>
  <!-- Magnifying glass -->
  <circle cx="210" cy="370" r="24" fill="none" stroke="#e94560" stroke-width="6"/>
  <line x1="228" y1="388" x2="248" y2="408" stroke="#e94560" stroke-width="6" stroke-linecap="round"/>
  <!-- RAG letters -->
  <text x="256" y="460" text-anchor="middle" font-family="monospace" font-size="40" font-weight="bold" fill="#e94560" letter-spacing="8">RAG</text>
</svg>
